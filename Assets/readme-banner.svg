<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.48" stop-color="#0B0F15"/>
      <stop offset="1" stop-color="#171B22"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4B8BBE"/>
      <stop offset="1" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE873"/>
      <stop offset="1" stop-color="#FFD43B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.216 0 0 0 0 0.463 0 0 0 0 0.671 0 0 0 0.55 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="220" fill="#10223A" opacity="0.42">
    <animate attributeName="r" values="190;230;190" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="300" r="190" fill="#151A22" opacity="0.8">
    <animate attributeName="cy" values="310;260;310" dur="8s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 278 C210 220 320 345 535 270 C770 187 888 242 1200 168 L1200 360 L0 360 Z" fill="#0E1722" opacity="0.7"/>

  <g transform="translate(84 77)" filter="url(#glow)">
    <rect x="0" y="0" width="196" height="196" rx="44" fill="#080B10" stroke="#2F4360" stroke-width="3"/>
    <g transform="translate(36 35)">
      <path d="M62 0C30 0 20 10 20 28v18h61c12 0 21 9 21 21v18H38C16 85 0 69 0 47C0 17 26 0 62 0Z" fill="url(#blue)"/>
      <path d="M66 126c32 0 42-10 42-28V80H47c-12 0-21-9-21-21V41h64c22 0 38 16 38 38c0 30-26 47-62 47Z" fill="url(#yellow)"/>
      <circle cx="50" cy="20" r="7" fill="#F6FAFF"/>
      <circle cx="78" cy="106" r="7" fill="#111111"/>
    </g>
  </g>

  <g transform="translate(330 92)">
    <text x="0" y="56" fill="#F6FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800">pyvswitch</text>
    <text x="0" y="104" fill="#AEB9C8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Fast Windows Python version switching from the tray</text>
    <text x="0" y="150" fill="#FFD43B" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">by ecuunlock.com</text>
    <g transform="translate(0 184)">
      <rect x="0" y="0" width="164" height="42" rx="13" fill="#111923" stroke="#3776AB" stroke-width="2"/>
      <text x="82" y="27" text-anchor="middle" fill="#F6FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Tray Utility</text>
      <rect x="184" y="0" width="148" height="42" rx="13" fill="#111923" stroke="#FFD43B" stroke-width="2"/>
      <text x="258" y="27" text-anchor="middle" fill="#F6FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">MIT License</text>
      <rect x="352" y="0" width="154" height="42" rx="13" fill="#111923" stroke="#3776AB" stroke-width="2"/>
      <text x="429" y="27" text-anchor="middle" fill="#F6FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Windows x64</text>
    </g>
