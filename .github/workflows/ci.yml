name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build PyVSwitch.sln -c Release --nologo

      - name: Test
        run: dotnet test PyVSwitch.sln -c Release --no-build --nologo

      - name: CLI smoke test
        shell: pwsh
        run: |
          $cli = "src/PyVSwitch.Cli/bin/Release/net9.0-windows/pyvswitch.exe"
          & $cli --version
          & $cli list --json
          & $cli available --series 3.12 --json | Select-Object -First 12
