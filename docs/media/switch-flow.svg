<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="How a switch works: the chosen Python moves to the front of PATH, other Pythons are removed, everything else keeps its order">
  <title>How a pyvswitch switch works</title>
  <style>
    .ui { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace; }

    /* One 12 second loop: rest, back up, drop the old version, raise the new one, hold. */
    .old   { animation: old 12s cubic-bezier(.5,0,.2,1) infinite; }
    .new   { animation: rise 12s cubic-bezier(.5,0,.2,1) infinite; }
    .tint  { animation: tint 12s linear infinite; }
    .was   { animation: was 12s linear infinite; }
    .now   { animation: now 12s linear infinite; }
    .s1    { animation: s1 12s linear infinite; }
    .s2    { animation: s2 12s linear infinite; }
    .s3    { animation: s3 12s linear infinite; }
    .saved { animation: saved 12s linear infinite; }

    /* Everything that moves is hidden for the last 6% of the loop, so the reset is never seen. */
    .cycle { animation: cycle 12s linear infinite; }
    @keyframes cycle { 0% { opacity: 0; } 4%, 90% { opacity: 1; } 94%, 100% { opacity: 0; } }

    @keyframes old   { 0%, 24% { opacity: 1; transform: translateX(0); } 34%, 95% { opacity: 0; transform: translateX(-46px); } 95.1%, 100% { opacity: 1; transform: translateX(0); } }
    @keyframes rise  { 0%, 32% { transform: translateY(0); } 46%, 95% { transform: translateY(-208px); } 95.1%, 100% { transform: translateY(0); } }
    @keyframes tint  { 0%, 44% { opacity: 0; } 50%, 95% { opacity: 1; } 95.1%, 100% { opacity: 0; } }
    @keyframes was   { 0%, 26% { opacity: 1; } 32%, 95% { opacity: 0; } 95.1%, 100% { opacity: 1; } }
    @keyframes now   { 0%, 46% { opacity: 0; } 52%, 95% { opacity: 1; } 95.1%, 100% { opacity: 0; } }
    @keyframes s1    { 0%, 8% { opacity: 0; } 12%, 90% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes s2    { 0%, 24% { opacity: 0; } 30%, 90% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes s3    { 0%, 48% { opacity: 0; } 54%, 90% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes saved { 0%, 8% { opacity: 0; transform: translateY(6px); } 14%, 90% { opacity: 1; transform: translateY(0); } 94%, 100% { opacity: 0; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#12161F"/>
    </linearGradient>
    <clipPath id="list"><rect x="56" y="104" width="600" height="330"/></clipPath>
  </defs>

  <rect width="1280" height="470" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="468" rx="23" fill="none" stroke="#252D3D" stroke-width="2"/>

  <text class="ui" x="60" y="58" font-size="24" font-weight="700" fill="#F3F6FB">How a switch works</text>
  <text class="ui" x="60" y="86" font-size="15" fill="#8490A5">Windows runs the first python.exe it finds on PATH, so pyvswitch simply decides who comes first.</text>

  <!-- PATH list -->
  <g clip-path="url(#list)"><g class="cycle">
    <!-- rows that never move -->
    <g class="mono" font-size="15">
      <g transform="translate(60 216)">
        <rect width="590" height="44" rx="10" fill="#141821" stroke="#222938"/>
        <text x="46" y="28" fill="#677286">%USERPROFILE%\.cargo\bin</text>
        <text x="18" y="28" fill="#465269" font-size="12">3</text>
      </g>
      <g transform="translate(60 268)">
        <rect width="590" height="44" rx="10" fill="#141821" stroke="#222938"/>
        <text x="46" y="28" fill="#677286">C:\Tools\bin</text>
        <text x="18" y="28" fill="#465269" font-size="12">4</text>
      </g>
    </g>

    <!-- the old default: removed from PATH -->
    <g class="old mono" font-size="15">
      <g transform="translate(60 112)">
        <rect width="590" height="44" rx="10" fill="#141821" stroke="#323C50"/>
        <text x="46" y="28" fill="#C4CCDA">C:\Python310-32</text>
        <text x="18" y="28" fill="#465269" font-size="12">1</text>
      </g>
      <g transform="translate(60 164)">
        <rect width="590" height="44" rx="10" fill="#141821" stroke="#323C50"/>
        <text x="46" y="28" fill="#C4CCDA">C:\Python310-32\Scripts</text>
        <text x="18" y="28" fill="#465269" font-size="12">2</text>
      </g>
    </g>

    <!-- the chosen version: rises to the front -->
    <g class="new mono" font-size="15">
      <g transform="translate(60 320)">
        <rect width="590" height="44" rx="10" fill="#141821" stroke="#323C50"/>
        <rect class="tint" width="590" height="44" rx="10" fill="#11281E" stroke="#3ECF8E" stroke-width="1.5" opacity="0"/>
        <text x="46" y="28" fill="#EDF1F7">…\Programs\Python\Python312</text>
      </g>
      <g transform="translate(60 372)">
        <rect width="590" height="44" rx="10" fill="#141821" stroke="#323C50"/>
        <rect class="tint" width="590" height="44" rx="10" fill="#11281E" stroke="#3ECF8E" stroke-width="1.5" opacity="0"/>
        <text x="46" y="28" fill="#EDF1F7">…\Programs\Python\Python312\Scripts</text>
      </g>
    </g>
  </g></g>

  <!-- what `python` resolves to -->
  <g class="ui cycle" font-size="13" font-weight="600">
    <g class="was">
      <rect x="452" y="121" width="184" height="26" rx="13" fill="#172740"/>
      <text x="544" y="139" text-anchor="middle" fill="#7DB8FA">python → 3.10 (32-bit)</text>
    </g>
    <g class="now" opacity="0">
      <rect x="484" y="121" width="152" height="26" rx="13" fill="#1C4532"/>
      <text x="560" y="139" text-anchor="middle" fill="#6EE7B0">python → 3.12.10</text>
    </g>
  </g>

  <!-- steps -->
  <g class="ui">
    <g transform="translate(712 112)">
      <rect width="508" height="92" rx="14" fill="#141821" stroke="#222938"/>
      <rect class="s1" width="508" height="92" rx="14" fill="none" stroke="#4C9BF5" stroke-width="1.5" opacity="0"/>
      <circle cx="40" cy="46" r="17" fill="#172740"/>
      <text x="40" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#7DB8FA">1</text>
      <text x="74" y="40" font-size="17" font-weight="600" fill="#EDF1F7">Back up</text>
      <text x="74" y="64" font-size="14" fill="#8490A5">The current PATH and py launcher default are saved.</text>
    </g>
    <g transform="translate(712 216)">
      <rect width="508" height="92" rx="14" fill="#141821" stroke="#222938"/>
      <rect class="s2" width="508" height="92" rx="14" fill="none" stroke="#4C9BF5" stroke-width="1.5" opacity="0"/>
      <circle cx="40" cy="46" r="17" fill="#172740"/>
      <text x="40" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#7DB8FA">2</text>
      <text x="74" y="40" font-size="17" font-weight="600" fill="#EDF1F7">Reorder</text>
      <text x="74" y="64" font-size="14" fill="#8490A5">Your pick moves to the front. Other Pythons leave PATH.</text>
    </g>
    <g transform="translate(712 320)">
      <rect width="508" height="92" rx="14" fill="#141821" stroke="#222938"/>
      <rect class="s3" width="508" height="92" rx="14" fill="none" stroke="#3ECF8E" stroke-width="1.5" opacity="0"/>
      <circle cx="40" cy="46" r="17" fill="#11281E"/>
      <text x="40" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#3ECF8E">3</text>
      <text x="74" y="40" font-size="17" font-weight="600" fill="#EDF1F7">Broadcast</text>
      <text x="74" y="64" font-size="14" fill="#8490A5">Windows is notified, so every new terminal picks it up.</text>
    </g>
  </g>

  <!-- rollback hint -->
  <g class="saved ui" opacity="0">
    <rect x="1050" y="44" width="170" height="30" rx="15" fill="#2B2610"/>
    <text x="1135" y="64" text-anchor="middle" font-size="13" font-weight="600" fill="#FFD43B">↩ one-click rollback</text>
  </g>
</svg>
