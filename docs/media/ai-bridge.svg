<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="AI assistants reach pyvswitch through its CLI and MCP server; pyvswitch manages each Python interpreter and its packages">
  <title>How AI assistants use pyvswitch</title>
  <style>
    .ui { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace; }
    .wire { fill: none; stroke: #2A3345; stroke-width: 2; }
    .wire-live { fill: none; stroke-width: 2; stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#12161F"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#2F7DE1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2F7DE1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="478" rx="23" fill="none" stroke="#252D3D" stroke-width="2"/>

  <text class="ui" x="60" y="58" font-size="24" font-weight="700" fill="#F3F6FB">Built for AI assistants</text>
  <text class="ui" x="60" y="86" font-size="15" fill="#8490A5">One command teaches every assistant on the PC the CLI and connects the MCP server:  pyvswitch ai setup</text>

  <!-- wires: assistants -> pyvswitch -->
  <g>
    <path class="wire" d="M300 148 C 400 148, 400 250, 500 250"/>
    <path class="wire" d="M300 206 C 390 206, 400 262, 500 262"/>
    <path class="wire" d="M300 264 C 380 264, 420 274, 500 274"/>
    <path class="wire" d="M300 322 C 390 322, 400 286, 500 286"/>
    <path class="wire" d="M300 380 C 400 380, 400 298, 500 298"/>
    <path class="wire-live" stroke="#4C9BF5" d="M300 148 C 400 148, 400 250, 500 250"/>
    <path class="wire-live" stroke="#4C9BF5" d="M300 206 C 390 206, 400 262, 500 262"/>
    <path class="wire-live" stroke="#4C9BF5" d="M300 264 C 380 264, 420 274, 500 274"/>
    <path class="wire-live" stroke="#4C9BF5" d="M300 322 C 390 322, 400 286, 500 286"/>
    <path class="wire-live" stroke="#4C9BF5" d="M300 380 C 400 380, 400 298, 500 298"/>
  </g>

  <!-- wires: pyvswitch -> interpreters -->
  <g>
    <path class="wire" d="M780 256 C 880 256, 880 164, 980 164"/>
    <path class="wire" d="M780 268 C 880 268, 880 236, 980 236"/>
    <path class="wire" d="M780 280 C 880 280, 880 308, 980 308"/>
    <path class="wire" d="M780 292 C 880 292, 880 380, 980 380"/>
    <path class="wire-live" stroke="#FFD43B" d="M780 256 C 880 256, 880 164, 980 164"/>
    <path class="wire-live" stroke="#FFD43B" d="M780 268 C 880 268, 880 236, 980 236"/>
    <path class="wire-live" stroke="#FFD43B" d="M780 280 C 880 280, 880 308, 980 308"/>
    <path class="wire-live" stroke="#FFD43B" d="M780 292 C 880 292, 880 380, 980 380"/>
  </g>

  <!-- assistants -->
  <g class="ui" font-size="15" font-weight="600" fill="#EDF1F7">
    <g transform="translate(60 126)"><rect width="240" height="44" rx="12" fill="#141821" stroke="#2A3345"/><circle cx="24" cy="22" r="5" fill="#4C9BF5"/><text x="44" y="27">Claude Code</text></g>
    <g transform="translate(60 184)"><rect width="240" height="44" rx="12" fill="#141821" stroke="#2A3345"/><circle cx="24" cy="22" r="5" fill="#4C9BF5"/><text x="44" y="27">Claude Desktop</text></g>
    <g transform="translate(60 242)"><rect width="240" height="44" rx="12" fill="#141821" stroke="#2A3345"/><circle cx="24" cy="22" r="5" fill="#4C9BF5"/><text x="44" y="27">OpenAI Codex</text></g>
    <g transform="translate(60 300)"><rect width="240" height="44" rx="12" fill="#141821" stroke="#2A3345"/><circle cx="24" cy="22" r="5" fill="#4C9BF5"/><text x="44" y="27">Cursor · Windsurf</text></g>
    <g transform="translate(60 358)"><rect width="240" height="44" rx="12" fill="#141821" stroke="#2A3345"/><circle cx="24" cy="22" r="5" fill="#4C9BF5"/><text x="44" y="27">VS Code Copilot · Gemini</text></g>
  </g>
  <text class="ui" x="60" y="436" font-size="13" fill="#677286">…or anything else that can run a command</text>

  <!-- pyvswitch core -->
  <ellipse cx="640" cy="274" rx="230" ry="170" fill="url(#core)"/>
  <g transform="translate(500 176)">
    <rect width="280" height="196" rx="18" fill="#141821" stroke="#4C9BF5" stroke-width="1.5"/>
    <text class="ui" x="140" y="42" text-anchor="middle" font-size="22" font-weight="800" fill="#F3F6FB">pyvswitch</text>
    <g transform="translate(20 62)">
      <rect width="240" height="52" rx="12" fill="#172740"/>
      <text class="ui" x="16" y="23" font-size="14" font-weight="700" fill="#7DB8FA">CLI</text>
      <text class="mono" x="16" y="41" font-size="12.5" fill="#C4CCDA">pyvswitch add numpy -p 3.12</text>
    </g>
    <g transform="translate(20 124)">
      <rect width="240" height="52" rx="12" fill="#172740"/>
      <text class="ui" x="16" y="23" font-size="14" font-weight="700" fill="#7DB8FA">MCP server · 14 tools</text>
      <text class="mono" x="16" y="41" font-size="12.5" fill="#C4CCDA">install_python · list_packages …</text>
    </g>
  </g>

  <!-- interpreters -->
  <g class="ui">
    <g transform="translate(980 136)">
      <rect width="240" height="56" rx="12" fill="#141821" stroke="#2A3345"/>
      <text x="18" y="25" font-size="15" font-weight="600" fill="#EDF1F7">Python 3.14</text>
      <text class="mono" x="18" y="44" font-size="12" fill="#8490A5">requests  numpy  fastapi</text>
    </g>
    <g transform="translate(980 208)">
      <rect width="240" height="56" rx="12" fill="#11281E" stroke="#3ECF8E" stroke-width="1.5"/>
      <text x="18" y="25" font-size="15" font-weight="600" fill="#EDF1F7">Python 3.12</text>
      <text x="222" y="25" text-anchor="end" font-size="12" font-weight="700" fill="#3ECF8E">default</text>
      <text class="mono" x="18" y="44" font-size="12" fill="#8490A5">pandas  torch  jupyter</text>
    </g>
    <g transform="translate(980 280)">
      <rect width="240" height="56" rx="12" fill="#141821" stroke="#2A3345"/>
      <text x="18" y="25" font-size="15" font-weight="600" fill="#EDF1F7">Python 3.10 (32-bit)</text>
      <text class="mono" x="18" y="44" font-size="12" fill="#8490A5">pyserial  python-can</text>
    </g>
    <g transform="translate(980 352)">
      <rect width="240" height="56" rx="12" fill="#141821" stroke="#2A3345" stroke-dasharray="5 5"/>
      <text x="18" y="25" font-size="15" font-weight="600" fill="#C4CCDA">Any python.org release</text>
      <text class="mono" x="18" y="44" font-size="12" fill="#8490A5">downloaded on request</text>
    </g>
  </g>
  <text class="ui" x="980" y="436" font-size="13" fill="#677286">Each interpreter keeps its own packages</text>
</svg>
